<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyRemote · Spotlight Search</title>
<style>
body{margin:0;background:#e9e8e5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
textarea::placeholder{color:rgba(235,235,245,0.3)}
input::placeholder{color:rgba(235,235,245,0.55)}
</style>
</head>
<body>
<div style="padding:40px 44px 48px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:baseline;gap:10px">
    <span style="font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px">LazyRemote</span>
    <span style="font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a">Spotlight Search · iOS RootView (dark) · 393×852 pt · see design.md</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)">1 · Closed (tap the magnifier to open)</div>
      <div class="phone" data-state="closed"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)">2 · Open (tap the dimmed area or press Escape to close)</div>
      <div class="phone" data-state="open"></div>
    </div>
  </div>
</div>

<template id="phone">
<div style="width:393px;height:852px;position:relative;background:#000;border-radius:55px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 0 0 11px #3a3a3c,0 30px 60px rgba(0,0,0,.25);color:#fff">
  <div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 32px 0 50px;box-sizing:border-box;z-index:5;pointer-events:none">
    <span style="font:600 17px/1 -apple-system,system-ui;letter-spacing:-0.2px">10:01</span>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="display:flex;align-items:flex-end;gap:1.5px;height:11px"><div style="width:3px;height:4px;background:#fff;border-radius:1px"></div><div style="width:3px;height:6px;background:#fff;border-radius:1px"></div><div style="width:3px;height:8.5px;background:#fff;border-radius:1px"></div><div style="width:3px;height:11px;background:rgba(255,255,255,.3);border-radius:1px"></div></div>
      <span style="font:600 15px/1 -apple-system,system-ui">5G</span>
      <div style="display:flex;align-items:center;gap:1px"><div style="width:25px;height:12px;border-radius:4px;background:#30d158;display:flex;align-items:center;justify-content:center;font:700 10px/1 -apple-system,system-ui;color:#fff">52</div><div style="width:1.5px;height:4px;background:rgba(255,255,255,.4);border-radius:0 1px 1px 0"></div></div>
    </div>
  </div>
  <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:6"></div>

  <div style="position:absolute;top:59px;left:0;right:0;bottom:102px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:12px;padding:14px 20px">
      <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0">
        <div style="width:8px;height:8px;border-radius:50%;background:#30d158;flex:none"></div>
        <span style="font-size:13px;line-height:18px;color:rgba(235,235,245,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Altay MB</span>
      </div>
      <div class="open-spot" aria-label="Spotlight Search" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="7.6" cy="7.6" r="5.9" fill="none" stroke="#0a84ff" stroke-width="1.7"></circle><line x1="12" y1="12" x2="16.3" y2="16.3" stroke="#0a84ff" stroke-width="1.9" stroke-linecap="round"></line></svg>
      </div>
      <div aria-label="Connection options" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8.1" fill="none" stroke="#0a84ff" stroke-width="1.5"></circle><circle cx="5.4" cy="9" r="1.15" fill="#0a84ff"></circle><circle cx="9" cy="9" r="1.15" fill="#0a84ff"></circle><circle cx="12.6" cy="9" r="1.15" fill="#0a84ff"></circle></svg>
      </div>
    </div>
    <div style="flex:1;min-height:0;padding:0 20px 14px;display:flex">
      <div style="flex:1;position:relative;background:#2c2c2e;border-radius:28px;overflow:hidden">
        <div style="position:absolute;left:16px;right:16px;bottom:16px;text-align:center;font-size:11px;line-height:13px;letter-spacing:0.06px;color:rgba(235,235,245,0.3)">Tap to click · Two-finger double-tap to right-click</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:34px;padding:12px 20px;display:flex;align-items:flex-end;gap:10px">
    <div style="flex:1;min-width:0;background:#2c2c2e;border-radius:20px;padding:11px 16px;display:flex">
      <textarea rows="1" placeholder="Type to send…" style="flex:1;min-width:0;background:transparent;border:0;outline:none;resize:none;color:#fff;font:17px/22px -apple-system,system-ui;padding:0;height:22px;caret-color:#0a84ff"></textarea>
    </div>
    <div style="width:42px;height:42px;border-radius:50%;flex:none;background:#2c2c2e;color:#fff;display:flex;align-items:center;justify-content:center">
      <svg width="21" height="15" viewBox="0 0 21 15"><path d="M7 1.2h11a2 2 0 0 1 2 2v8.6a2 2 0 0 1-2 2H7a2 2 0 0 1-1.5-.7L1.3 8.3a1.2 1.2 0 0 1 0-1.6l4.2-4.8A2 2 0 0 1 7 1.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M10 4.6l5 5.8M15 4.6l-5 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
    </div>
    <div style="width:42px;height:42px;border-radius:50%;flex:none;background:#2c2c2e;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="16" viewBox="0 0 20 16"><path d="M18 1.5v5.2a2.5 2.5 0 0 1-2.5 2.5H3" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"></path><path d="M6.8 5.2L2.6 9.2l4.2 4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>

  <div class="fab" aria-label="Remote" style="position:absolute;left:328px;top:531px;width:58px;height:58px;border-radius:50%;background:rgba(44,44,46,0.86);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.18),0 8px 24px rgba(0,0,0,0.5);backdrop-filter:blur(20px);color:#fff;display:flex;align-items:center;justify-content:center;z-index:4">
    <svg width="28" height="28" viewBox="0 0 24 24"><rect x="6" y="1.5" width="12" height="21" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect><circle cx="12" cy="8.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"></circle><circle cx="9.6" cy="15.5" r="1.1" fill="currentColor"></circle><circle cx="14.4" cy="15.5" r="1.1" fill="currentColor"></circle></svg>
  </div>

  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;z-index:10;pointer-events:none"></div>

  <div class="spot" style="display:none">
    <div class="spot-scrim" style="position:absolute;inset:0;z-index:8;background:rgba(0,0,0,0.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)"></div>
    <div style="position:absolute;top:70px;left:14px;right:14px;z-index:9;height:56px;border-radius:28px;background:rgba(74,70,68,0.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.18),0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;padding:0 20px">
      <svg width="22" height="22" viewBox="0 0 18 18" style="flex:none"><circle cx="7.6" cy="7.6" r="5.9" fill="none" stroke="rgba(235,235,245,0.6)" stroke-width="1.6"></circle><line x1="12" y1="12" x2="16.3" y2="16.3" stroke="rgba(235,235,245,0.6)" stroke-width="1.8" stroke-linecap="round"></line></svg>
      <input class="spot-input" placeholder="Spotlight Search" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font:400 22px/28px -apple-system,system-ui;padding:0;caret-color:#fff">
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:336px;z-index:9;background:repeating-linear-gradient(135deg,#1f1f21 0 8px,#252527 8px 16px);display:flex;align-items:center;justify-content:center">
      <span style="font:11px ui-monospace,Menlo,monospace;color:rgba(235,235,245,0.45)">iOS system keyboard · 336 pt · return key “go”</span>
    </div>
  </div>
</div>
</template>

<script>
const tpl = document.getElementById('phone');
document.querySelectorAll('.phone').forEach(host => {
  host.appendChild(tpl.content.cloneNode(true));
  const spot = host.querySelector('.spot'), fab = host.querySelector('.fab'), input = host.querySelector('.spot-input');
  const set = (open, focus) => {
    spot.style.display = open ? 'block' : 'none';
    fab.style.display = open ? 'none' : 'flex';
    if (open && focus) requestAnimationFrame(() => input.focus());
    if (!open) input.value = '';
  };
  set(host.dataset.state === 'open', false);
  host.querySelector('.open-spot').addEventListener('click', () => set(true, true));
  host.querySelector('.spot-scrim').addEventListener('pointerdown', e => { e.preventDefault(); set(false); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') set(false);
    if (e.key === 'Enter' && input.value.trim()) set(false);
  });
});
</script>
</body>
</html>
